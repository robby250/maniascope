# x86-64-v2 (SSE4.2, POPCNT; every x86 CPU since 2009, required by Windows 11 24H2): rounding and bit counts become single
# instructions instead of libm/bit-twiddling calls. Same IEEE results.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]
